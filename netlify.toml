[build]
  command = "npm run build"
  publish = "public"
  functions = "netlify/functions"
[build.environment]
  NODE_VERSION = "22"
[functions]
  node_bundler = "esbuild"
[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "no-referrer"
[[redirects]]
  from = "/api/search"
  to = "/.netlify/functions/musicbrainz?operation=search"
  status = 200
  force = true
[[redirects]]
  from = "/api/recording"
  to = "/.netlify/functions/musicbrainz?operation=recording"
  status = 200
  force = true
